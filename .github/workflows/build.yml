name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub ubuntu runners ship the Android SDK pre-installed.
      # Install official apktool jar which bundles a working aapt.
      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          printf '#!/bin/bash\nexec java -jar /tmp/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Build with apktool
        run: |
          apktool b . -o maya.apk --force
          ls -lh maya.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-apk
          path: maya.apk

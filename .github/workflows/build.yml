name: Build APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub ubuntu runners ship the Android SDK pre-installed:
      # zipalign and apksigner come from build-tools (on ANDROID_HOME path).
      - name: Install apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          printf '#!/bin/bash\nexec java -jar /tmp/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool > /dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/build-tools/" 2>/dev/null || true
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "$BT" >> "$GITHUB_PATH"

      - name: Build with apktool
        run: |
          apktool b . -o maya.apk --force
          ls -lh maya.apk

      # Android 11+ refuses v1-only (jarsigner) APKs; must sign with v2/v3
      # via apksigner after zipalign. Keystore comes from repo secrets; if
      # unset, a throwaway key is generated so the artifact still installs.
      - name: Align and sign APK
        env:
          KS_B64: ${{ secrets.APKSIGNER_BASE64 }}
          PASS: ${{ secrets.APKSIGNER_STOREPASS }}
          ALIAS: ${{ secrets.APKSIGNER_ALIAS }}
        run: |
          set -e
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > maya.keystore
            PASS=${PASS:-maya12345}
            ALIAS=${ALIAS:-maya}
          else
            keytool -genkeypair -v -keystore maya.keystore -alias maya -keyalg RSA -keysize 2048 -validity 10000 -storepass ci_maya_pass -keypass ci_maya_pass -dname "CN=Maya Clone, OU=Dev, O=Maya, L=City, ST=State, C=IN" >/dev/null 2>&1
            PASS=ci_maya_pass
            ALIAS=maya
          fi
          zipalign -f -p 4 maya.apk maya-aligned.apk
          apksigner sign --ks maya.keystore --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" \
            --out maya-signed.apk maya-aligned.apk
          apksigner verify --verbose maya-signed.apk
          mv maya-signed.apk maya.apk
          ls -lh maya.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-apk
          path: maya.apk
